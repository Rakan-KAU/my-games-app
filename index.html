<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title id="pageTitle">🇸🇦 Rakan Gaming Studios | المتجر السعودي</title>
    
    <!-- EmailJS Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("7VO1N_mmmzdizDhhW");
        })();
    </script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #070d0a; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .top-nav-buttons { position: fixed; top: 20px; left: 20px; z-index: 1002; display: flex; gap: 10px; }
        .top-btn { background: #111e17; color: #d4af37; border: 1px solid #006c35; padding: 9px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .top-btn:hover { background: #006c35; color: #ffffff; border-color: #d4af37; }

        #heroScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #0f2318 0%, #050a07 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; padding: 20px; }
        .hero-badge { background: rgba(212, 175, 55, 0.15); border: 1px solid #d4af37; color: #d4af37; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 800; margin-bottom: 20px; letter-spacing: 1px; }
        .hero-main-title { font-size: 56px; font-weight: 900; color: #ffffff; letter-spacing: 1px; margin-bottom: 30px; text-shadow: 0 0 35px rgba(0, 108, 53, 0.6); }
        .btn-continue { padding: 18px 55px; background: linear-gradient(135deg, #006c35, #044b25); color: #ffffff; border: 1px solid #d4af37; border-radius: 35px; font-size: 19px; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(0, 108, 53, 0.5); }
        .btn-continue:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4); background: linear-gradient(135deg, #044b25, #006c35); }

        #checkoutModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 10, 7, 0.96); display: none; justify-content: center; align-items: center; z-index: 1001; backdrop-filter: blur(12px); }
        .login-box { background: #0f1a14; border: 1px solid #006c35; padding: 35px; border-radius: 20px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9); }
        .login-box h2 { color: #d4af37; margin-bottom: 15px; font-size: 22px; font-weight: 800; }
        .login-box input, .login-box select { width: 100%; padding: 12px 15px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #1f3a2b; background: #070d0a; color: #fff; font-size: 14px; outline: none; }
        .login-box input:focus, .login-box select:focus { border-color: #d4af37; }
        .login-box button { width: 100%; padding: 13px; background: #006c35; color: white; border: 1px solid #d4af37; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .login-box button:hover { background: #044b25; }

        .card-row { display: flex; gap: 10px; }

        #storeWrapper { display: none; padding: 30px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .store-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1f3a2b; padding-bottom: 20px; }
        .store-logo-area h1 { font-size: 26px; color: #d4af37; font-weight: 900; letter-spacing: 1px; }

        .store-layout { display: flex; gap: 30px; }
        .store-sidebar { width: 280px; background: #0f1a14; border: 1px solid #1f3a2b; border-radius: 16px; padding: 25px; height: fit-content; }
        .store-sidebar h3 { color: #d4af37; font-size: 16px; margin-bottom: 15px; font-weight: 800; border-bottom: 1px solid #1f3a2b; padding-bottom: 10px; }
        .filter-btn { display: block; width: 100%; background: transparent; color: #94a3b8; border: none; padding: 12px 15px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: 0.2s; text-align: right; }
        .filter-btn:hover, .filter-btn.active { background: #1f3a2b; color: #d4af37; border-right: 4px solid #006c35; }

        .store-content { flex: 1; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .game-card { background: #0f1a14; border: 1px solid #1f3a2b; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .game-card:hover { border-color: #d4af37; transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,108,53,0.3); }
        .game-title { font-size: 20px; font-weight: bold; color: #ffffff; margin-bottom: 8px; }
        .game-badge { background: #070d0a; color: #d4af37; padding: 5px 10px; border-radius: 6px; font-size: 12px; display: inline-block; margin-bottom: 15px; border: 1px solid #1f3a2b; }
        .game-price { font-size: 22px; font-weight: 900; color: #10b981; margin-bottom: 15px; }
        .btn-buy { background: linear-gradient(135deg, #006c35, #044b25); color: white; border: 1px solid #d4af37; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-buy:hover { background: #d4af37; color: #070d0a; font-weight: 900; }

        .status { padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; font-weight: 600; position: fixed; bottom: 20px; right: 20px; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="top-nav-buttons">
        <button class="top-btn" id="langBtn" onclick="toggleLanguage()">English 🌐</button>
    </div>

    <div id="heroScreen">
        <div class="hero-badge">🇸🇦 المتجر الرقمي السعودي المعتمد</div>
        <h1 class="hero-main-title" id="t_heroTitle">استديو راكان للألعاب</h1>
        <button class="btn-continue" id="t_continueBtn" onclick="openCustomerStore()">دخول المتجر الرئيسي ⬅</button>
    </div>

    <div id="checkoutModal">
        <div class="login-box">
            <div id="stepInfo">
                <h2 id="t_checkoutTitle">🛒 إتمام طلب الشراء</h2>
                <p id="checkoutGameTitle" style="color:#d4af37; font-weight:bold; margin-bottom:15px;"></p>
                <input type="text" id="chk_name" placeholder="الاسم الكامل">
                <input type="email" id="chk_email" placeholder="البريد الإلكتروني (لاستلام الحساب)">
                <input type="text" id="chk_phone" placeholder="رقم الهاتف (مثال: 05xxxxxxxx)">
                <select id="chk_region">
                    <option value="منطقة مكة المكرمة">منطقة مكة المكرمة</option>
                    <option value="منطقة الرياض">منطقة الرياض</option>
                    <option value="المنطقة الشرقية">المنطقة الشرقية</option>
                    <option value="منطقة عسير">منطقة عسير</option>
                    <option value="منطقة المدينة المنورة">منطقة المدينة المنورة</option>
                </select>
                <select id="chk_city">
                    <option value="جدة">جدة</option>
                    <option value="الرياض">الرياض</option>
                    <option value="مكة المكرمة">مكة المكرمة</option>
                    <option value="الدمام">الدمام</option>
                </select>
                <button onclick="goToPaymentStep()" id="t_nextPayBtn" style="background:#006c35; margin-top:5px;">متابعة إلى الدفع 💳</button>
                <button onclick="closeCheckoutModal()" id="t_cancelBtn1" style="background:#1f3a2b; margin-top:8px;">إلغاء</button>
            </div>

            <div id="stepPayment" style="display:none;">
                <h2 id="t_paymentTitle">💳 بوابة الدفع الآمنة (مدى / الفيزا)</h2>
                <p id="t_paymentSub" style="color:#94a3b8; font-size:13px; margin-bottom:15px;">أدخل بيانات البطاقة المصرفية</p>
                <input type="text" id="card_name" placeholder="اسم حامل البطاقة">
                <input type="text" id="card_number" placeholder="رقم البطاقة (16 رقم)" maxlength="19">
                <div class="card-row">
                    <input type="text" id="card_exp" placeholder="MM/YY" maxlength="5">
                    <input type="password" id="card_cvv" placeholder="CVV" maxlength="4">
                </div>
                <button onclick="submitOrder()" id="t_confirmBtn" style="background:#006c35; border:1px solid #d4af37; margin-top:10px;">تأكيد الدفع 🔒</button>
                <button onclick="backToInfoStep()" id="t_backBtn" style="background:#1f3a2b; margin-top:8px;">رجوع للبيانات</button>
            </div>
        </div>
    </div>

    <div id="storeWrapper">
        <div class="store-header">
            <div class="store-logo-area">
                <h1 id="t_storeHeaderTitle">🌴 متجر RAKAN STUDIOS</h1>
            </div>
        </div>
        <div class="store-layout">
            <div class="store-sidebar">
                <h3 id="t_platformsHeader">🎮 أقسام المنصات</h3>
                <button class="filter-btn active" id="t_filterAll" onclick="filterPlatform('All', event)">🔥 جميع الألعاب</button>
                <button class="filter-btn" onclick="filterPlatform('PlayStation 5', event)">🎮 PlayStation 5</button>
                <button class="filter-btn" onclick="filterPlatform('PC Gaming', event)">💻 PC Gaming</button>
                <button class="filter-btn" onclick="filterPlatform('Xbox Series X', event)">🕹️ Xbox Series X</button>
                <button class="filter-btn" onclick="filterPlatform('Multi-Platform', event)">🌐 Multi-Platform (متعدد)</button>
            </div>
            <div class="store-content">
                <div class="games-grid" id="store_games_grid">
                    <p style="text-align:center; grid-column: 1/-1;">جاري جلب الألعاب...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="statusMsg" class="status"></div>

<script>
    const API_URL = "https://rakan-games-97-g6hxapcfg7h6fjfk.centralindia-01.azurewebsites.net/api/GameApi";
    let allStoreGames = [];
    let selectedGameForCheckout = null;
    let currentLang = 'ar';

    const translations = {
        ar: {
            heroTitle: "استديو راكان للألعاب",
            continueBtn: "دخول المتجر الرئيسي ⬅",
            checkoutTitle: "🛒 إتمام طلب الشراء",
            nextPayBtn: "متابعة إلى الدفع 💳",
            cancelBtn: "إلغاء",
            paymentTitle: "💳 بوابة الدفع الآمنة (مدى / الفيزا)",
            paymentSub: "أدخل بيانات البطاقة المصرفية",
            confirmBtn: "تأكيد الدفع 🔒",
            backBtn: "رجوع للبيانات",
            storeHeaderTitle: "🌴 متجر RAKAN STUDIOS",
            platformsHeader: "🎮 أقسام المنصات",
            filterAll: "🔥 جميع الألعاب",
            langBtnText: "English 🌐"
        },
        en: {
            heroTitle: "Rakan Gaming Studio",
            continueBtn: "Enter Official Store ⬅",
            checkoutTitle: "🛒 Checkout Order",
            nextPayBtn: "Proceed to Payment 💳",
            cancelBtn: "Cancel",
            paymentTitle: "💳 Payment Gateway (Mada / Visa)",
            paymentSub: "Enter Credit Card Details",
            confirmBtn: "Confirm Payment 🔒",
            backBtn: "Back to Details",
            storeHeaderTitle: "🌴 RAKAN STUDIOS STORE",
            platformsHeader: "🎮 Platforms",
            filterAll: "🔥 All Games",
            langBtnText: "العربية 🌐"
        }
    };

    function toggleLanguage() {
        currentLang = (currentLang === 'ar') ? 'en' : 'ar';
        const t = translations[currentLang];
        const root = document.getElementById('htmlRoot');

        root.setAttribute('lang', currentLang);
        root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

        document.getElementById('t_heroTitle').innerText = t.heroTitle;
        document.getElementById('t_continueBtn').innerText = t.continueBtn;
        document.getElementById('t_checkoutTitle').innerText = t.checkoutTitle;
        document.getElementById('t_nextPayBtn').innerText = t.nextPayBtn;
        document.getElementById('t_cancelBtn1').innerText = t.cancelBtn;
        document.getElementById('t_paymentTitle').innerText = t.paymentTitle;
        document.getElementById('t_paymentSub').innerText = t.paymentSub;
        document.getElementById('t_confirmBtn').innerText = t.confirmBtn;
        document.getElementById('t_backBtn').innerText = t.backBtn;
        document.getElementById('t_storeHeaderTitle').innerText = t.storeHeaderTitle;
        document.getElementById('t_platformsHeader').innerText = t.platformsHeader;
        document.getElementById('t_filterAll').innerText = t.filterAll;
        document.getElementById('langBtn').innerText = t.langBtnText;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const storeView = sessionStorage.getItem('storeOpened');
        if (storeView === 'true') {
            openCustomerStore(true);
        }
    });

    function openCustomerStore(isReload = false) {
        sessionStorage.setItem('storeOpened', 'true');
        document.getElementById('heroScreen').style.display = 'none';
        document.getElementById('storeWrapper').style.display = 'block';
        loadStoreGames();
    }

    async function loadStoreGames() {
        const grid = document.getElementById('store_games_grid');
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">جاري جلب الألعاب...</p>';
        try {
            const res = await fetch(`${API_URL}?type=games&_t=${Date.now()}`, { cache: "no-store" });
            allStoreGames = await res.json();
            renderStoreGames(allStoreGames);
        } catch (err) {
            grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#ef4444;">حدث خطأ في تحميل الألعاب</p>';
        }
    }

    function filterPlatform(platform, evt) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (evt) evt.target.classList.add('active');

        if (platform === 'All') {
            renderStoreGames(allStoreGames);
        } else {
            const filtered = allStoreGames.filter(g => (g.platform || '').toLowerCase() === platform.toLowerCase());
            renderStoreGames(filtered);
        }
    }

    function renderStoreGames(games) {
        const grid = document.getElementById('store_games_grid');
        grid.innerHTML = '';

        if (!games || games.length === 0) {
            grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#94a3b8;">لا توجد ألعاب متاحة في هذا القسم حالياً.</p>';
            return;
        }

        games.forEach(game => {
            grid.innerHTML += `
                <div class="game-card">
                    <div>
                        <div class="game-title">${game.title || 'لعبة بدون عنوان'}</div>
                        <div class="game-badge">${game.platform || 'Multi-Platform'}</div>
                    </div>
                    <div>
                        <div class="game-price">$${game.price || '0'}</div>
                        <button class="btn-buy" onclick="openCheckout('${game.title}', '${game.price}')">شراء الآن 🚀</button>
                    </div>
                </div>
            `;
        });
    }

    function openCheckout(title, price) {
        selectedGameForCheckout = { title, price };
        document.getElementById('checkoutGameTitle').innerText = `المنتج: ${title} ($${price})`;
        document.getElementById('chk_name').value = '';
        document.getElementById('chk_email').value = '';
        document.getElementById('chk_phone').value = '';
        document.getElementById('card_name').value = '';
        document.getElementById('card_number').value = '';
        document.getElementById('card_exp').value = '';
        document.getElementById('card_cvv').value = '';
        
        document.getElementById('stepInfo').style.display = 'block';
        document.getElementById('stepPayment').style.display = 'none';
        document.getElementById('checkoutModal').style.display = 'flex';
    }

    function goToPaymentStep() {
        const name = document.getElementById('chk_name').value.trim();
        const email = document.getElementById('chk_email').value.trim();
        const phone = document.getElementById('chk_phone').value.trim();

        if (!name) return alert('الرجاء إدخال الاسم الكامل');
        if (!email) return alert('الرجاء إدخال البريد الإلكتروني');
        if (!phone) return alert('الرجاء إدخال رقم الهاتف');

        document.getElementById('stepInfo').style.display = 'none';
        document.getElementById('stepPayment').style.display = 'block';
    }

    function backToInfoStep() {
        document.getElementById('stepPayment').style.display = 'none';
        document.getElementById('stepInfo').style.display = 'block';
    }

    function closeCheckoutModal() {
        document.getElementById('checkoutModal').style.display = 'none';
    }

    async function submitOrder() {
        const name = document.getElementById('chk_name').value.trim();
        const email = document.getElementById('chk_email').value.trim();
        const phone = document.getElementById('chk_phone').value.trim();
        const region = document.getElementById('chk_region').value;
        const city = document.getElementById('chk_city').value;
        
        const cardNumber = document.getElementById('card_number').value.trim();
        const cardExp = document.getElementById('card_exp').value.trim();
        const cardCvv = document.getElementById('card_cvv').value.trim();

        if (!cardNumber || !cardExp || !cardCvv) {
            return alert('الرجاء إكمال كافة بيانات البطاقة للدفع');
        }

        const generatedUser = "RakanUser_" + Math.floor(1000 + Math.random() * 9000);
        const generatedPass = "RK#" + Math.floor(10000 + Math.random() * 90000);

        const orderBody = { type: 'orders', customerId: name, item: selectedGameForCheckout.title, total: selectedGameForCheckout.price || '0', status: 'تم الدفع' };
        const customerBody = { type: 'customers', name: name, region: region, city: city, phone: phone };

        const templateParams = {
            to_email: email,
            to_name: name,
            user_email: email,
            game_title: selectedGameForCheckout.title,
            game_price: selectedGameForCheckout.price || '0',
            game_user: generatedUser,
            game_pass: generatedPass
        };

        closeCheckoutModal();
        showStatus("جاري معالجة الطلب وتأكيد عملية الدفع...");

        try {
            await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(orderBody) });
            await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(customerBody) });
        } catch (e) {
            console.log("Order Processed");
        }

        try {
            await emailjs.send('service_kj03hap', 'template_jy0t1z5', templateParams);
        } catch (err) {
            console.log("Notification Processed");
        }

        document.body.innerHTML = `
            <div style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#070d0a; color:white; text-align:center; padding:20px;">
                <h1 style="color:#d4af37; font-size:42px; margin-bottom:15px; font-weight:900;">✨ تمت عملية الدفع بنجاح</h1>
                <p style="font-size:18px; color:#94a3b8; max-width:550px; line-height:1.6;">شكراً لثقتك وتسوقك معنا. تم إرسال بيانات وتفاصيل الحساب فوراً إلى بريدك الإلكتروني:</p>
                <p style="font-size:24px; color:#10b981; font-weight:bold; margin-top:15px; text-decoration:underline;">${email}</p>
                <p style="font-size:15px; color:#d4af37; margin-top:15px; font-weight:600;">يرجى تفقد إيميلك لاستلام البيانات 📥</p>
                <button onclick="location.reload()" style="margin-top:35px; padding:16px 45px; background:#006c35; border:1px solid #d4af37; border-radius:12px; color:white; font-weight:bold; font-size:16px; cursor:pointer; box-shadow:0 8px 20px rgba(0,108,53,0.4);">العودة للمتجر 🚀</button>
            </div>
        `;
    }

    function showStatus(msg, isErr = false) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.style.display = 'block';
        el.style.backgroundColor = isErr ? '#7f1d1d' : '#006c35';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }
</script>
</body>
</html>
