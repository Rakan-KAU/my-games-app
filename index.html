        }
    });

    function openCustomerStore(isReload = false) {
        sessionStorage.setItem('storeOpened', 'true');
        document.getElementById('heroScreen').style.display = 'none';
        document.getElementById('storeWrapper').style.display = 'block';
        loadStoreGames();
    }

    async function loadStoreGames() {
        const grid = document.getElementById('store_games_grid');
        const t = translations[currentLang] || translations.en;
        grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">${t.loadingText}</p>`;
        try {
            const res = await fetch(`${API_URL}?type=games&_t=${Date.now()}`, { cache: "no-store" });
            allStoreGames = await res.json();
            renderStoreGames(allStoreGames);
        } catch (err) {
            grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#ef4444;">Error loading games.</p>';
        }
    }

    function filterPlatform(platform, evt) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (evt) evt.target.classList.add('active');

        if (platform === 'All') {
            renderStoreGames(allStoreGames);
        } else {
            const filtered = allStoreGames.filter(g => (g.platform || '').toLowerCase() === platform.toLowerCase());
            renderStoreGames(filtered);
        }
    }

    function renderStoreGames(games) {
        const grid = document.getElementById('store_games_grid');
        const t = translations[currentLang] || translations.en;
        grid.innerHTML = '';

        if (!games || games.length === 0) {
            grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color:#94a3b8;">${t.noGamesText}</p>`;
            return;
        }

        games.forEach(game => {
            const convertedPriceText = formatPrice(game.price || '0');
            grid.innerHTML += `
                <div class="game-card">
                    <div>
                        <div class="game-title">${game.title || 'Game'}</div>
                        <div class="game-badge">${game.platform || 'Multi-Platform'}</div>
                    </div>
                    <div>
                        <div class="game-price">${convertedPriceText}</div>
                        <button class="btn-buy" onclick="openCheckout('${game.title}', '${game.price}')">${t.buyBtnText}</button>
                    </div>
                </div>
            `;
        });
    }

    function openCheckout(title, price) {
        const convertedPriceText = formatPrice(price || '0');
        selectedGameForCheckout = { title, price };
        document.getElementById('checkoutGameTitle').innerText = `${title} (${convertedPriceText})`;
        document.getElementById('chk_name').value = '';
        document.getElementById('chk_email').value = '';
        document.getElementById('chk_phone').value = '';
        document.getElementById('card_name').value = '';
        document.getElementById('card_number').value = '';
        document.getElementById('card_exp').value = '';
        document.getElementById('card_cvv').value = '';
        
        document.getElementById('stepInfo').style.display = 'block';
        document.getElementById('stepPayment').style.display = 'none';
        document.getElementById('checkoutModal').style.display = 'flex';
    }

    function goToPaymentStep() {
        const name = document.getElementById('chk_name').value.trim();
        const email = document.getElementById('chk_email').value.trim();
        const phone = document.getElementById('chk_phone').value.trim();

        if (!name || !email || !phone) {
            return alert('Please fill out all required fields');
        }

        document.getElementById('stepInfo').style.display = 'none';
        document.getElementById('stepPayment').style.display = 'block';
    }

    function backToInfoStep() {
        document.getElementById('stepPayment').style.display = 'none';
        document.getElementById('stepInfo').style.display = 'block';
    }

    function closeCheckoutModal() {
        document.getElementById('checkoutModal').style.display = 'none';
    }

    async function submitOrder() {
        const name = document.getElementById('chk_name').value.trim();
        const email = document.getElementById('chk_email').value.trim();
        const phone = document.getElementById('chk_phone').value.trim();
        const region = document.getElementById('chk_region').value;
        const city = document.getElementById('chk_city').value;
        
        const cardNumber = document.getElementById('card_number').value.trim();
        const cardExp = document.getElementById('card_exp').value.trim();
        const cardCvv = document.getElementById('card_cvv').value.trim();

        if (!cardNumber || !cardExp || !cardCvv) {
            return alert('Please fill out all card details');
        }

        const generatedUser = "RakanUser_" + Math.floor(1000 + Math.random() * 9000);
        const generatedPass = "RK#" + Math.floor(10000 + Math.random() * 90000);

        const orderBody = { type: 'orders', customerId: name, item: selectedGameForCheckout.title, total: selectedGameForCheckout.price || '0', status: 'تم الدفع' };
        const customerBody = { type: 'customers', name: name, region: region, city: city, phone: phone };

        const templateParams = {
            to_email: email,
            to_name: name,
            user_email: email,
            game_title: selectedGameForCheckout.title,
            game_price: formatPrice(selectedGameForCheckout.price || '0'),
            game_user: generatedUser,
            game_pass: generatedPass
        };

        closeCheckoutModal();
        showStatus("Processing order...");

        try {
            await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(orderBody) });
            await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(customerBody) });
        } catch (e) {
            console.log("Order Processed");
        }

        try {
            await emailjs.send('service_kj03hap', 'template_jy0t1z5', templateParams);
        } catch (err) {
            console.log("Notification Processed");
        }

        const t = translations[currentLang] || translations.en;

        document.body.innerHTML = `
            <div style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#060911; color:white; text-align:center; padding:20px;">
                <h1 style="color:#00ff87; font-size:48px; margin-bottom:15px; font-weight:900; text-shadow:0 0 30px rgba(0,255,135,0.4);">${t.successTitle}</h1>
                <p style="font-size:18px; color:#94a3b8; max-width:550px; line-height:1.6;">${t.successSub}</p>
                <p style="font-size:26px; color:#00f0ff; font-weight:bold; margin-top:15px; text-decoration:underline;">${email}</p>
                <p style="font-size:16px; color:#00ff87; margin-top:18px; font-weight:700;">${t.successNotice}</p>
                <button onclick="location.reload()" style="margin-top:35px; padding:16px 50px; background:linear-gradient(135deg, #00ff87, #00b894); border:none; border-radius:30px; color:#060911; font-weight:900; font-size:16px; cursor:pointer; box-shadow:0 0 25px rgba(0,255,135,0.4);">${t.backToStoreBtn}</button>
            </div>
        `;
    }

    function showStatus(msg, isErr = false) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.style.display = 'block';
        el.style.backgroundColor = isErr ? '#7f1d1d' : '#0f172a';
        el.style.border = '1px solid #00ff87';
        el.style.color = '#00ff87';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }
</script>
</body>
</html>
