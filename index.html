<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الشركة | Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #1a252f; }
        
        /* شاشة تسجيل الدخول */
        #login-screen { max-width: 350px; margin: 50px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* التبويبات */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: #e4e6eb; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: #0078d4; color: white; }
        
        /* النماذج والجداول */
        .form-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; wrap: wrap; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 10px 18px; border: none; background: #28a745; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.delete-btn { background: #dc3545; padding: 6px 12px; }
        button.logout-btn { background: #6c757d; float: left; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #0078d4; color: white; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 2px solid #0078d4; border-radius: 6px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1️⃣ شاشة تسجيل دخول الأدمن -->
    <div id="login-screen">
        <h2>🔐 دخول المسؤول (Admin)</h2>
        <input type="text" id="username" placeholder="اسم المستخدم (admin)" style="width:100%; margin-bottom:10px;"><br>
        <input type="password" id="password" placeholder="كلمة المرور (1234)" style="width:100%; margin-bottom:15px;"><br>
        <button onclick="login()" style="width:100%;">تسجيل الدخول</button>
        <p id="login-error" style="color:red; display:none; margin-top:10px;">بيانات الدخول خاطئة!</p>
    </div>

    <!-- 2️⃣ لوحة التحكم الرئيسية (تظهر بعد الدخول) -->
    <div id="admin-dashboard" class="container hidden">
        <button class="logout-btn" onclick="logout()">خروج 🚪</button>
        <h1>🏢 لوحة إدارة الشركة والألعاب</h1>
        <p style="color: #666;">مرحباً بك يا أدمن، لديك كامل الصلاحيات للتحكم بالأسعار والموظفين.</p>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('employees')">👥 إدارة الموظفين</button>
            <button class="tab-btn" onclick="switchTab('games')">🎮 إدارة الألعاب والأسعار</button>
        </div>

        <!-- 👥 قسم الموظفين -->
        <div id="employees-section">
            <h2>قائمة الموظفين</h2>
            <input type="text" id="empSearch" class="search-box" placeholder="🔍 استعلام / بحث عن موظف..." onkeyup="searchEmp()">
            
            <div class="form-group">
                <input type="text" id="empName" placeholder="اسم الموظف">
                <input type="text" id="empRole" placeholder="المسمى الوظيفي">
                <input type="number" id="empSalary" placeholder="الراتب ($)">
                <button onclick="addEmployee()">إضافة موظف</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الوظيفة</th>
                        <th>الراتب</th>
                        <th>التحكم</th>
                    </tr>
                </thead>
                <tbody id="empTable">
                    <!-- الموظفون سيظهرون هنا -->
                </tbody>
            </table>
        </div>

        <!-- 🎮 قسم الألعاب والأسعار -->
        <div id="games-section" class="hidden">
            <h2>قائمة الألعاب والأسعار</h2>
            <input type="text" id="gameSearch" class="search-box" placeholder="🔍 استعلام / بحث عن لعبة..." onkeyup="searchGame()">
            
            <div class="form-group">
                <input type="text" id="gameTitle" placeholder="اسم اللعبة">
                <input type="number" id="gamePrice" placeholder="السعر ($)">
                <button onclick="addGame()">إضافة لعبة</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>اسم اللعبة</th>
                        <th>السعر</th>
                        <th>التحكم بالأسعار والمنتج</th>
                    </tr>
                </thead>
                <tbody id="gameTable">
                    <!-- الألعاب ستظهر هنا -->
                </tbody>
            </table>
        </div>
    </div>

<script>
    // بيانات أولية للعرض
    let employees = [
        { id: 1, name: "راكان", role: "مدير النظام", salary: 15000 },
        { id: 2, name: "أحمد علي", role: "مطور ألعاب", salary: 9000 }
    ];

    let games = [
        { id: 1, title: "Rocket League", price: 20 },
        { id: 2, title: "FC 24", price: 60 }
    ];

    // تسجيل الدخول
    function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === 'admin' && p === '1234') {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            renderData();
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    }

    function logout() {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('admin-dashboard').classList.add('hidden');
    }

    // التنقل بين التبويبات
    function switchTab(tab) {
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        
        if(tab === 'employees') {
            document.getElementById('employees-section').classList.remove('hidden');
            document.getElementById('games-section').classList.add('hidden');
            btns[0].classList.add('active');
        } else {
            document.getElementById('employees-section').classList.add('hidden');
            document.getElementById('games-section').classList.remove('hidden');
            btns[1].classList.add('active');
        }
    }

    // عرض البيانات
    function renderData() {
        // جدول الموظفين
        const empT = document.getElementById('empTable');
        empT.innerHTML = employees.map(e => `
            <tr>
                <td>${e.name}</td>
                <td>${e.role}</td>
                <td>$${e.salary}</td>
                <td><button class="delete-btn" onclick="deleteEmp(${e.id})">حذف</button></td>
            </tr>
        `).join('');

        // جدول الألعاب
        const gameT = document.getElementById('gameTable');
        gameT.innerHTML = games.map(g => `
            <tr>
                <td>${g.title}</td>
                <td>$${g.price}</td>
                <td><button class="delete-btn" onclick="deleteGame(${g.id})">حذف</button></td>
            </tr>
        `).join('');
    }

    // إضافة وحذف موظف
    function addEmployee() {
        const name = document.getElementById('empName').value;
        const role = document.getElementById('empRole').value;
        const salary = document.getElementById('empSalary').value;
        if(name && role && salary) {
            employees.push({ id: Date.now(), name, role, salary });
            renderData();
            document.getElementById('empName').value = '';
            document.getElementById('empRole').value = '';
            document.getElementById('empSalary').value = '';
        }
    }
    function deleteEmp(id) { employees = employees.filter(e => e.id !== id); renderData(); }

    // إضافة وحذف لعبة
    function addGame() {
        const title = document.getElementById('gameTitle').value;
        const price = document.getElementById('gamePrice').value;
        if(title && price) {
            games.push({ id: Date.now(), title, price });
            renderData();
            document.getElementById('gameTitle').value = '';
            document.getElementById('gamePrice').value = '';
        }
    }
    function deleteGame(id) { games = games.filter(g => g.id !== id); renderData(); }

    // البحث والاستعلام
    function searchEmp() {
        const query = document.getElementById('empSearch').value.toLowerCase();
        const rows = document.querySelectorAll('#empTable tr');
        rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(query) ? '' : 'none');
    }
    function searchGame() {
        const query = document.getElementById('gameSearch').value.toLowerCase();
        const rows = document.querySelectorAll('#gameTable tr');
        rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(query) ? '' : 'none');
    }
</script>

</body>
</html>
