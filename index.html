<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- منع التخزين المؤقت (No Cache) لضمان التحديث الفوري -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title id="pageTitle">⚡ Rakan Gaming Studios | المتجر</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .top-nav-buttons { position: fixed; top: 20px; left: 20px; z-index: 1002; display: flex; gap: 10px; }
        .top-btn { background: #131b2e; color: #38bdf8; border: 1px solid #1f2937; padding: 9px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .top-btn:hover { background: #1f2937; color: #10b981; }

        #heroScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #131b2e 0%, #0b0f19 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; padding: 20px; }
        .hero-main-title { font-size: 64px; font-weight: 900; color: #ffffff; letter-spacing: 2px; margin-bottom: 30px; text-shadow: 0 0 40px rgba(16, 185, 129, 0.4); }
        .btn-continue { padding: 18px 50px; background: linear-gradient(135deg, #10b981, #047857); color: white; border: none; border-radius: 35px; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4); text-transform: uppercase; letter-spacing: 1px; }

        #checkoutModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.95); display: none; justify-content: center; align-items: center; z-index: 1001; backdrop-filter: blur(10px); }
        .login-box { background: #131b2e; border: 1px solid #1f2937; padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); }
        .login-box h2 { color: #38bdf8; margin-bottom: 20px; font-size: 22px; font-weight: 800; }
        .login-box input, .login-box select { width: 100%; padding: 13px 16px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #334155; background: #0b0f19; color: #fff; font-size: 14px; outline: none; text-align: right; }
        .login-box button { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; }

        #storeWrapper { display: none; padding: 30px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .store-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1f2937; padding-bottom: 20px; }
        .store-logo-area h1 { font-size: 26px; color: #10b981; font-weight: 900; }
        .btn-back { background: #334155; color: white; border: none; padding: 10px 22px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .store-layout { display: flex; gap: 30px; }
        .store-sidebar { width: 280px; background: #131b2e; border: 1px solid #1f2937; border-radius: 16px; padding: 25px; height: fit-content; }
        .filter-btn { display: block; width: 100%; background: transparent; color: #94a3b8; border: none; padding: 12px 15px; border-radius: 8px; text-align: right; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        .filter-btn.active { background: #1f2937; color: #10b981; border-right: 3px solid #10b981; }

        .store-content { flex: 1; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .game-card { background: #131b2e; border: 1px solid #1f2937; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; }
        .game-title { font-size: 20px; font-weight: bold; color: #ffffff; margin-bottom: 8px; }
        .game-badge { background: #0b0f19; color: #38bdf8; padding: 5px 10px; border-radius: 6px; font-size: 12px; display: inline-block; margin-bottom: 15px; border: 1px solid #1f2937; }
        .game-price { font-size: 22px; font-weight: 900; color: #10b981; margin-bottom: 15px; }
        .btn-buy { background: #10b981; color: white; border: none; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

        .status { padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; font-weight: 600; position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
    </style>
</head>
<body>

    <div class="top-nav-buttons">
        <button class="top-btn" id="langBtn" onclick="toggleLanguage()">English 🌐</button>
    </div>

    <div id="heroScreen">
        <h1 class="hero-main-title" id="t_heroTitle">راكان جيمنج استديو</h1>
        <button class="btn-continue" id="t_continueBtn" onclick="openCustomerStore()">متابعة إلى المتجر ⬅</button>
    </div>

    <div id="checkoutModal">
        <div class="login-box">
            <h2 id="t_checkoutTitle">🛒 إتمام طلب الشراء</h2>
            <p id="checkoutGameTitle" style="color:#10b981; font-weight:bold; margin-bottom:15px;"></p>
            <input type="text" id="chk_name" placeholder="الاسم الكامل">
            <input type="text" id="chk_phone" placeholder="رقم الهاتف (مثال: 05xxxxxxxx)">
            <select id="chk_region">
                <option value="منطقة مكة المكرمة">منطقة مكة المكرمة</option>
                <option value="منطقة الرياض">منطقة الرياض</option>
                <option value="المنطقة الشرقية">المنطقة الشرقية</option>
                <option value="منطقة عسير">منطقة عسير</option>
                <option value="منطقة المدينة المنورة">منطقة المدينة المنورة</option>
            </select>
            <select id="chk_city">
                <option value="جدة">جدة</option>
                <option value="الرياض">الرياض</option>
                <option value="مكة المكرمة">مكة المكرمة</option>
                <option value="الدمام">الدمام</option>
            </select>
            <button onclick="submitOrder()" id="t_confirmBtn">تأكيد وإرسال الطلب 🚀</button>
            <button onclick="closeCheckoutModal()" id="t_closeModalBtn" style="background:#334155; margin-top:8px;">إلغاء</button>
        </div>
    </div>

    <div id="storeWrapper">
        <div class="store-header">
            <div class="store-logo-area">
                <h1 id="t_storeHeaderTitle">⚡ متجر RAKAN STUDIOS</h1>
            </div>
            <button class="btn-back" id="t_storeBackBtn" onclick="backToHero()">الرئيسية ⬅</button>
        </div>
        <div class="store-layout">
            <div class="store-sidebar">
                <h3 id="t_platformsHeader">🎮 أقسام المنصات</h3>
                <button class="filter-btn active" id="t_filterAll" onclick="filterPlatform('All', event)">🔥 جميع الألعاب</button>
                <button class="filter-btn" onclick="filterPlatform('PlayStation 5', event)">🎮 PlayStation 5</button>
                <button class="filter-btn" onclick="filterPlatform('PC Gaming', event)">💻 PC Gaming</button>
                <button class="filter-btn" onclick="filterPlatform('Xbox Series X', event)">🕹️ Xbox Series X</button>
                <button class="filter-btn" onclick="filterPlatform('Multi-Platform', event)">🌐 Multi-Platform (متعدد)</button>
            </div>
            <div class="store-content">
                <div class="games-grid" id="store_games_grid">
                    <p style="text-align:center; grid-column: 1/-1;">جاري تحميل الألعاب من السحابة...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="statusMsg" class="status"></div>

<script>
    const API_URL = "https://rakan-games-97-g6hxapcfg7h6fjfk.centralindia-01.azurewebsites.net/api/GameApi";
    let allStoreGames = [];
    let selectedGameForCheckout = null;

    // حفظ واسترجاع حالة الصفحة عند التحديث
    window.addEventListener('DOMContentLoaded', () => {
        const storeView = sessionStorage.getItem('storeOpened');
        if (storeView === 'true') {
            openCustomerStore(true);
        }
    });

    function openCustomerStore(isReload = false) {
        sessionStorage.setItem('storeOpened', 'true');
        document.getElementById('heroScreen').style.display = 'none';
        document.getElementById('storeWrapper').style.display = 'block';
        loadStoreGames();
    }

    function backToHero() {
        sessionStorage.removeItem('storeOpened');
        document.getElementById('storeWrapper').style.display = 'none';
        document.getElementById('heroScreen').style.display = 'flex';
    }

    async function loadStoreGames() {
        const grid = document.getElementById('store_games_grid');
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">جاري تحميل الألعاب من السحابة...</p>';
        try {
            // إضافة Timestamp لكسر الكاش السحابي
            const res = await fetch(`${API_URL}?type=games&_t=${Date.now()}`, { cache: "no-store" });
            allStoreGames = await res.json();
            renderStoreGames(allStoreGames);
        } catch (err) {
            grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#ef4444;">حدث خطأ في تحميل الألعاب من السحابة</p>';
        }
    }

    function filterPlatform(platform, evt) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (evt) evt.target.classList.add('active');

        if (platform === 'All') {
            renderStoreGames(allStoreGames);
        } else {
            const filtered = allStoreGames.filter(g => (g.platform || '').toLowerCase() === platform.toLowerCase());
            renderStoreGames(filtered);
        }
    }

    function renderStoreGames(games) {
        const grid = document.getElementById('store_games_grid');
        grid.innerHTML = '';

        if (!games || games.length === 0) {
            grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#94a3b8;">لا توجد ألعاب متاحة في هذا القسم حالياً.</p>';
            return;
        }

        games.forEach(game => {
            grid.innerHTML += `
                <div class="game-card">
                    <div>
                        <div class="game-title">${game.title || 'لعبة بدون عنوان'}</div>
                        <div class="game-badge">${game.platform || 'Multi-Platform'}</div>
                    </div>
                    <div>
                        <div class="game-price">$${game.price || '0'}</div>
                        <button class="btn-buy" onclick="openCheckout('${game.title}', '${game.price}')">شراء الآن 🚀</button>
                    </div>
                </div>
            `;
        });
    }

    function openCheckout(title, price) {
        selectedGameForCheckout = { title, price };
        document.getElementById('checkoutGameTitle').innerText = `المنتج: ${title} ($${price})`;
        document.getElementById('chk_name').value = '';
        document.getElementById('chk_phone').value = '';
        document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeCheckoutModal() {
        document.getElementById('checkoutModal').style.display = 'none';
    }

    async function submitOrder() {
        const name = document.getElementById('chk_name').value.trim();
        const phone = document.getElementById('chk_phone').value.trim();
        const region = document.getElementById('chk_region').value;
        const city = document.getElementById('chk_city').value;

        if (!name) return alert('الرجاء إدخال الاسم الكامل');
        if (!phone) return alert('الرجاء إدخال رقم الهاتف');

        const orderBody = { type: 'orders', customerId: name, item: selectedGameForCheckout.title, total: selectedGameForCheckout.price || '0', status: 'Pending' };
        const customerBody = { type: 'customers', name: name, region: region, city: city, phone: phone };

        try {
            closeCheckoutModal();
            showStatus("جاري معالجة الطلب وإرساله للسحابة...");
            await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(orderBody) });
            await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(customerBody) });
            alert(`تم استلام طلبك بنجاح! شكراً لك على الطلب من Rakan Gaming Studios`);
        } catch (err) {
            alert("حدث خطأ أثناء إتمام الشراء.");
        }
    }

    function showStatus(msg, isErr = false) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.style.display = 'block';
        el.style.backgroundColor = isErr ? '#7f1d1d' : '#065f46';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }
</script>
</body>
</html>
