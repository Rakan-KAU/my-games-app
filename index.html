<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الألعاب السحابي | Game Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px 0 40px;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .game-platform {
            display: inline-block;
            background: #334155;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .game-price {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--success-color);
            margin-bottom: 15px;
        }

        .btn-buy {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-buy:hover {
            opacity: 0.9;
        }

        /* Modal / Checkout Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            max-width: 450px;
            width: 100%;
            border: 1px solid #475569;
        }

        .modal-card h2 {
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #64748b;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            flex: 1;
            cursor: pointer;
        }

        .btn-pay {
            background: var(--success-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            flex: 2;
            font-weight: bold;
            cursor: pointer;
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 متجر الألعاب السحابي</h1>
        <p>اختر لعبتك المفضلة، واستلم حسابك فوراً على إيميلك الإلكتروني</p>
    </header>

    <div class="games-grid" id="gamesContainer">
        <!-- الألعاب تنزل هنا تلقائياً من الكود -->
    </div>

    <!-- نافذة الدفع الشاملة -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-card">
            <h2 id="modalGameTitle">إتمام الطلب والدفع</h2>
            
            <form id="checkoutForm" onsubmit="handlePayment(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="custName" placeholder="أدخل اسمك" required>
                </div>
                
                <div class="form-group">
                    <label>البريد الإلكتروني (لتلقي بيانات الحساب)</label>
                    <input type="email" id="custEmail" placeholder="example@domain.com" required>
                </div>

                <div class="form-group">
                    <label>طريقة الدفع</label>
                    <select id="payMethod">
                        <option value="Mada">مدى (Mada)</option>
                        <option value="Visa">فيزا / ماستر كارد</option>
                        <option value="ApplePay">Apple Pay</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>رقم البطاقة (دفع وهمي للتجربة)</label>
                    <input type="text" placeholder="4000 0000 0000 0000" maxlength="19" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>التاريخ</label>
                        <input type="text" placeholder="12/28" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>CVC</label>
                        <input type="text" placeholder="123" maxlength="3" required>
                    </div>
                </div>

                <div class="status-msg" id="statusBox"></div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn-pay" id="payBtn">تأكيد ودفع</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // تهيئة EmailJS للإرسال
        (function(){
            emailjs.init("YOUR_PUBLIC_KEY"); // اختيارية أو تعمل المحاكاة الفورية
        })();

        // قائمة الألعاب الافتراضية
        let defaultGames = [
            { id: 1, name: "EA SPORTS FC 24 (FIFA)", platform: "PS5 / PS4", price: 199 },
            { id: 2, name: "Rocket League Special Pack", platform: "All Platforms", price: 79 },
            { id: 3, name: "Call of Duty: Modern Warfare III", platform: "PS5 / PC", price: 249 }
        ];

        let selectedGame = null;

        // تحميل الألعاب عند فتح الصفحة
        function renderGames() {
            const container = document.getElementById('gamesContainer');
            const storedGames = JSON.parse(localStorage.getItem('my_games_list')) || defaultGames;
            
            container.innerHTML = storedGames.map(game => `
                <div class="game-card">
                    <div>
                        <div class="game-title">${game.name}</div>
                        <span class="game-platform">${game.platform}</span>
                    </div>
                    <div>
                        <div class="game-price">${game.price} ر.س</div>
                        <button class="btn-buy" onclick="openCheckout(${game.id}, '${game.name}', ${game.price})">شراء الآن 🚀</button>
                    </div>
                </div>
            `).join('');
        }

        function openCheckout(id, name, price) {
            selectedGame = { id, name, price };
            document.getElementById('modalGameTitle').innerText = `شراء: ${name}`;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('checkoutModal').style.display = 'none';
            document.getElementById('statusBox').style.display = 'none';
        }

        // معالجة الدفع وإصدار الحساب
        function handlePayment(e) {
            e.preventDefault();
            
            const name = document.getElementById('custName').value;
            const email = document.getElementById('custEmail').value;
            const payBtn = document.getElementById('payBtn');
            const statusBox = document.getElementById('statusBox');

            payBtn.innerText = "جاري الدفع والتأكيد...";
            payBtn.disabled = true;

            setTimeout(() => {
                // إنشاء بيانات حساب وهمية تلقائياً للعبة
                const genUser = "User_" + Math.floor(1000 + Math.random() * 9000);
                const genPass = "Pass_" + Math.floor(10000 + Math.random() * 90000);

                // تسجيل الطلب في السجل المحلي للـ Admin
                const orders = JSON.parse(localStorage.getItem('my_orders_list')) || [];
                orders.push({
                    id: Date.now(),
                    customer: name,
                    email: email,
                    game: selectedGame.name,
                    price: selectedGame.price,
                    status: "Paid",
                    date: new Date().toLocaleDateString('ar-SA')
                });
                localStorage.setItem('my_orders_list', JSON.stringify(orders));

                // عرض إشعار النجاح وبيانات الحساب مباشرة للمستخدم
                statusBox.className = "status-msg status-success";
                statusBox.style.display = "block";
                statusBox.innerHTML = `
                    ✅ <b>تمت عملية الدفع بنجاح!</b><br>
                    📧 تم إرسال الرسالة إلى: <b>${email}</b><br><br>
                    🔑 <b>بيانات حسابك للعبة:</b><br>
                    المستخدم: <code>${genUser}</code><br>
                    كلمة المرور: <code>${genPass}</code>
                `;

                payBtn.innerText = "تم الشراء بنجاح ✅";
            }, 1500);
        }

        renderGames();
    </script>
</body>
</html>
