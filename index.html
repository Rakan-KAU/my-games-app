<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة الألعاب - Azure Cloud</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select, button { padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; flex: 1; min-width: 150px; }
        button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: right; }
        th { background: #0f172a; color: #38bdf8; }
        .btn-delete { background: #ef4444; padding: 6px 12px; border-radius: 4px; border: none; color: white; cursor: pointer; }
        .btn-delete:hover { background: #dc2626; }
        .status { margin-top: 10px; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 لوحة تحكم ألعاب الشركة (Azure Connected)</h1>
    
    <div id="statusMessage" class="status"></div>

    <div class="form-group">
        <input type="text" id="gameTitle" placeholder="اسم اللعبة (مثال: Rocket League)">
        <input type="text" id="gamePlatform" placeholder="المنصة (مثال: PS5 / PC)">
        <input type="number" id="gamePrice" placeholder="السعر ($)">
        <button onclick="addGame()">إضافة للـ Azure</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>اسم اللعبة</th>
                <th>المنصة</th>
                <th>السعر</th>
                <th>الإجراء</th>
            </tr>
        </thead>
        <tbody id="gamesTableBody">
            <tr><td colspan="4" style="text-align:center;">جاري تحميل البيانات من Azure...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // رابط الـ API الخاص بـ Azure Function حقك
    const AZURE_API_URL = "https://rakan-games-97-g6hxapcfg7h6fjfk.centralindia-01.azurewebsites.net/api/GameApi";

    function showStatus(msg, isError = false) {
        const el = document.getElementById('statusMessage');
        el.innerText = msg;
        el.style.display = 'block';
        el.style.backgroundColor = isError ? '#7f1d1d' : '#065f46';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    // 1. جلب البيانات من Azure
    async function fetchGames() {
        try {
            const res = await fetch(AZURE_API_URL);
            const data = await res.json();
            const tbody = document.getElementById('gamesTableBody');
            tbody.innerHTML = '';

            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">لا توجد ألعاب حالياً. أضف لعبة جديدة!</td></tr>';
                return;
            }

            data.forEach(game => {
                tbody.innerHTML += `
                    <tr>
                        <td>${game.title}</td>
                        <td>${game.platform}</td>
                        <td>${game.price === 0 ? 'مجانية' : '$' + game.price}</td>
                        <td><button class="btn-delete" onclick="deleteGame(${game.id})">حذف</button></td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
            showStatus("فشل الاتصال بـ Azure API", true);
        }
    }

    // 2. إضافة لعبة جديدة إلى Azure
    async function addGame() {
        const title = document.getElementById('gameTitle').value;
        const platform = document.getElementById('gamePlatform').value;
        const price = document.getElementById('gamePrice').value;

        if (!title || !platform) {
            alert("يرجى تعبئة اسم اللعبة والمنصة!");
            return;
        }

        const newGame = { title, platform, price: parseFloat(price) || 0 };

        try {
            showStatus("جاري الحفظ في Azure...");
            const res = await fetch(AZURE_API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newGame)
            });

            if (res.ok) {
                showStatus("تمت إضافة اللعبة إلى Azure بنجاح! 🚀");
                document.getElementById('gameTitle').value = '';
                document.getElementById('gamePlatform').value = '';
                document.getElementById('gamePrice').value = '';
                fetchGames();
            } else {
                showStatus("خطأ أثناء الإضافة", true);
            }
        } catch (err) {
            showStatus("حدث خطأ أثناء إرسال البيانات", true);
        }
    }

    // 3. حذف لعبة من Azure
    async function deleteGame(id) {
        if(!confirm("هل أنت تأكد من حذف اللعبة؟")) return;

        try {
            showStatus("جاري الحذف من Azure...");
            const res = await fetch(`${AZURE_API_URL}?id=${id}`, { method: "DELETE" });
            if (res.ok) {
                showStatus("تم الحذف بنجاح!");
                fetchGames();
            } else {
                showStatus("خطأ أثناء الحذف", true);
            }
        } catch (err) {
            showStatus("حدث خطأ أثناء عملية الحذف", true);
        }
    }

    // تشغيل جلب الألعاب عند فتح الصفحة مباشرة
    fetchGames();
</script>

</body>
</html>
