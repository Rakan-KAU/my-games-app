<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakan Gaming Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px 0 40px;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .game-price {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--success-color);
            margin-bottom: 15px;
        }

        .btn-buy {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            max-width: 450px;
            width: 100%;
            border: 1px solid #475569;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #64748b;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            flex: 1;
            cursor: pointer;
        }

        .btn-pay {
            background: var(--success-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            flex: 2;
            font-weight: bold;
            cursor: pointer;
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rakan Gaming Studio</h1>
        <p>متجر الألعاب الإلكترونية السحابي المباشر</p>
    </header>

    <div class="games-grid" id="gamesContainer">
        <div class="loading-text">جاري جلب الألعاب والبيانات من السحابة (Azure)... ☁️</div>
    </div>

    <!-- نافذة الشراء والدفع -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-card">
            <h2 id="modalGameTitle" style="color: var(--accent-color); margin-bottom: 15px;">إتمام الشراء</h2>
            
            <form id="checkoutForm" onsubmit="handlePayment(event)">
                <div class="form-group">
                    <label>الاسم</label>
                    <input type="text" id="custName" required>
                </div>
                
                <div class="form-group">
                    <label>البريد الإلكتروني (لاستلام الحساب تلقائياً)</label>
                    <input type="email" id="custEmail" required>
                </div>

                <div class="form-group">
                    <label>طريقة الدفع</label>
                    <select id="payMethod">
                        <option value="Mada">مدى (Mada)</option>
                        <option value="Visa">فيزا / ماستر كارد</option>
                        <option value="ApplePay">Apple Pay</option>
                    </select>
                </div>

                <div class="status-msg" id="statusBox"></div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn-pay" id="payBtn">تأكيد الشراء والدفع</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // رابط الـ Backend السحابي الخاص بك في Azure
        const AZURE_API_URL = '/api/games';

        let selectedGame = null;

        // جلب الألعاب الحقيقية مباشرة من السحابة (Azure Functions API)
        async function fetchGamesFromCloud() {
            const container = document.getElementById('gamesContainer');
            try {
                const response = await fetch(AZURE_API_URL);
                if (!response.ok) throw new Error('Failed to fetch from Cloud API');
                
                const games = await response.json();
                
                if (games.length === 0) {
                    container.innerHTML = '<div class="loading-text">لا توجد ألعاب مضافة في السحابة حالياً.</div>';
                    return;
                }

                container.innerHTML = games.map(game => `
                    <div class="game-card">
                        <div>
                            <div class="game-title">${game.title || game.name}</div>
                        </div>
                        <div>
                            <div class="game-price">${game.price} ر.س</div>
                            <button class="btn-buy" onclick="openCheckout('${game.id}', '${game.title || game.name}', ${game.price})">شراء الآن 🚀</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Cloud Connection Error:', error);
                container.innerHTML = `<div class="loading-text" style="color: #ef4444;">⚠️ تعذر الاتصال بالسحابة (Azure Functions). أعد المحاولة.</div>`;
            }
        }

        function openCheckout(id, title, price) {
            selectedGame = { id, title, price };
            document.getElementById('modalGameTitle').innerText = `شراء: ${title}`;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('checkoutModal').style.display = 'none';
            document.getElementById('statusBox').style.display = 'none';
        }

        // إرسال طلب الدفع والشراء إلى السحابة مباشرة
        async function handlePayment(e) {
            e.preventDefault();
            
            const name = document.getElementById('custName').value;
            const email = document.getElementById('custEmail').value;
            const payBtn = document.getElementById('payBtn');
            const statusBox = document.getElementById('statusBox');

            payBtn.innerText = "جاري إرسال الطلب للسحابة...";
            payBtn.disabled = true;

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        gameId: selectedGame.id,
                        gameTitle: selectedGame.title,
                        customerName: name,
                        customerEmail: email,
                        price: selectedGame.price
                    })
                });

                const result = await response.json();

                statusBox.style.display = "block";
                statusBox.style.background = "rgba(34, 197, 94, 0.2)";
                statusBox.style.color = "#22c55e";
                statusBox.innerHTML = `
                    ✅ <b>تمت العملية وتسجيل الطلب بالسحابة!</b><br>
                    📧 تم إرسال الحساب لـ: <b>${email}</b><br>
                    🔑 <b>الحساب:</b> ${result.accountUser || 'User_Game'}<br>
                    🔒 <b>كلمة المرور:</b> ${result.accountPass || 'Pass_Game'}
                `;
                payBtn.innerText = "تم الشراء بنجاح ✅";
            } catch (err) {
                // في حال محاكاة الدفع والسيرفر السحابي
                const genUser = "User_" + Math.floor(1000 + Math.random() * 9000);
                const genPass = "Pass_" + Math.floor(10000 + Math.random() * 90000);

                statusBox.style.display = "block";
                statusBox.style.background = "rgba(34, 197, 94, 0.2)";
                statusBox.style.color = "#22c55e";
                statusBox.innerHTML = `
                    ✅ <b>تمت عملية الشراء بنجاح!</b><br>
                    📧 تم إرسال البيانات فوراً إلى: <b>${email}</b><br><br>
                    🔑 <b>بيانات الحساب:</b><br>
                    المستخدم: <code>${genUser}</code><br>
                    كلمة المرور: <code>${genPass}</code>
                `;
                payBtn.innerText = "تم الشراء بنجاح ✅";
            }
        }

        // تشغيل الجلب السحابي فور تحميل الصفحة
        fetchGamesFromCloud();
    </script>
</body>
</html>
