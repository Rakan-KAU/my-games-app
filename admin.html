<!-- استبدل محتوى الـ script في ملفك بهذا الجزء المحدث -->
<script>
    const API = "https://rakan-games-97-g6hxapcfg7h6fjfk.centralindia-01.azurewebsites.net/api/GameApi";
    let storeCache = {};

    function switchTab(tab, evt) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        if(evt) evt.target.classList.add('active');
        loadData(tab);
    }

    async function loadData(type) {
        try {
            const res = await fetch(`${API}?type=${type}&_t=${Date.now()}`);
            storeCache[type] = await res.json();
            const tbody = document.querySelector(`#${type}_table`); // تأكدت من مطابقة المعرفات
            tbody.innerHTML = '';

            storeCache[type].forEach((item, idx) => {
                let row = document.createElement('tr');
                let key = item.title || item.name || item.customerId;
                let cells = "";

                if (type === 'games') cells = `<td>${item.title || '-'}</td><td>$${item.price || 0}</td>`;
                else if (type === 'employees') cells = `<td>${item.name || '-'}</td><td>${item.role || '-'}</td><td>$${item.salary || 0}</td>`;
                else if (type === 'customers') cells = `<td>${item.name || '-'}</td><td>${item.phone || '-'}</td>`;
                else cells = `<td>${item.customerId || '-'}</td><td>$${item.total || 0}</td>`;

                row.innerHTML = cells + `<td>
                    <button class="btn-tb-edit" onclick="prepareEdit('${type}', ${idx})" style="background:#d97706; color:white; border:none; padding:5px 10px; border-radius:5px;">تعديل ✏️</button>
                    <button class="btn-tb-del" onclick="deleteItem('${type}', '${key}')" style="background:#dc2626; color:white; border:none; padding:5px 10px; border-radius:5px;">حذف 🗑️</button>
                </td>`;
                tbody.appendChild(row);
            });
        } catch(e) { console.error(e); }
    }

    function prepareEdit(type, idx) {
        const item = storeCache[type][idx];
        if (type === 'games') {
            document.getElementById('g_oldTitle').value = item.title;
            document.getElementById('g_title').value = item.title;
            document.getElementById('g_price').value = item.price;
        } else if (type === 'employees') {
            document.getElementById('e_oldName').value = item.name;
            document.getElementById('e_name').value = item.name;
            document.getElementById('e_role').value = item.role;
            document.getElementById('e_salary').value = item.salary;
        } else if (type === 'customers') {
            document.getElementById('c_oldName').value = item.name;
            document.getElementById('c_name').value = item.name;
            document.getElementById('c_phone').value = item.phone;
        } else if (type === 'orders') {
            document.getElementById('o_oldId').value = item.customerId;
            document.getElementById('o_customerId').value = item.customerId;
            document.getElementById('o_total').value = item.total;
        }
    }

    async function saveData(type) {
        let payload = { type: type };
        let oldKey = "";

        if (type === 'games') {
            payload.title = document.getElementById('g_title').value.trim();
            payload.price = document.getElementById('g_price').value.trim();
            oldKey = document.getElementById('g_oldTitle').value;
        } else if (type === 'employees') {
            payload.name = document.getElementById('e_name').value.trim();
            payload.title = payload.name; // للـ API
            payload.role = document.getElementById('e_role').value.trim();
            payload.salary = document.getElementById('e_salary').value.trim();
            oldKey = document.getElementById('e_oldName').value;
        } else if (type === 'customers') {
            payload.name = document.getElementById('c_name').value.trim();
            payload.title = payload.name;
            payload.phone = document.getElementById('c_phone').value.trim();
            oldKey = document.getElementById('c_oldName').value;
        } else if (type === 'orders') {
            payload.customerId = document.getElementById('o_customerId').value.trim();
            payload.title = payload.customerId;
            payload.total = document.getElementById('o_total').value.trim();
            oldKey = document.getElementById('o_oldId').value;
        }

        // الحذف أولاً (إذا كان تعديل)
        if (oldKey) {
            await fetch(`${API}?type=${type}&title=${encodeURIComponent(oldKey)}`, { method: "DELETE" });
        }

        // إضافة الجديد
        const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            // تفريغ الحقول
            if (type === 'games') { document.getElementById('g_oldTitle').value = ''; document.getElementById('g_title').value = ''; document.getElementById('g_price').value = ''; }
            else if (type === 'employees') { document.getElementById('e_oldName').value = ''; document.getElementById('e_name').value = ''; document.getElementById('e_role').value = ''; document.getElementById('e_salary').value = ''; }
            else if (type === 'customers') { document.getElementById('c_oldName').value = ''; document.getElementById('c_name').value = ''; document.getElementById('c_phone').value = ''; }
            else if (type === 'orders') { document.getElementById('o_oldId').value = ''; document.getElementById('o_customerId').value = ''; document.getElementById('o_total').value = ''; }
            
            loadData(type); // تحديث الجدول فوراً
        } else {
            alert("فشل الحفظ، تأكد من البيانات!");
        }
    }

    async function deleteItem(type, key) {
        if (!confirm(`هل أنت متأكد من حذف (${key})؟`)) return;
        await fetch(`${API}?type=${type}&title=${encodeURIComponent(key)}`, { method: "DELETE" });
        loadData(type);
    }
</script>
