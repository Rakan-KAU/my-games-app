<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 RAKAN STUDIOS | لوحة التحكم والإدارة الملكية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        :root { --bg-dark: #070907; --card-bg: #131a14; --gold-primary: #a67c52; --green-saudi: #006c35; --danger: #dc2626; --warning: #d97706; --text-main: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; overflow-x: hidden; }
        #loginModal { position: fixed; top:0; left:0; width: 100vw; height: 100vh; background: radial-gradient(circle, #101c12, #040805); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: rgba(19, 26, 20, 0.95); border: 2px solid var(--gold-primary); padding: 45px; border-radius: 28px; width: 400px; text-align: center; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #263829; background: #070907; color: white; }
        .btn-login { width: 100%; padding: 15px; background: var(--green-saudi); color: white; border: none; border-radius: 12px; cursor: pointer; }
        #appWrapper { display: none; width: 100%; min-height: 100vh; }
        .sidebar { width: 290px; background: var(--card-bg); border-left: 2px solid #263829; padding: 30px; }
        .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px; background: transparent; color: #d4c5b9; border: 1px solid transparent; border-radius: 12px; cursor: pointer; margin-bottom: 10px; text-align: right; }
        .nav-btn.active { background: var(--green-saudi); color: white; }
        .main-content { flex: 1; padding: 35px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card-panel { background: var(--card-bg); border: 1px solid #263829; border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #263829; background: #070907; color: white; }
        .btn-action { background: var(--green-saudi); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #263829; text-align: right; }
        .btn-edit { background: var(--warning); color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; border: none; }
        .btn-del { background: var(--danger); color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; border: none; }
    </style>
</head>
<body>

<div id="loginModal">
    <div class="login-card">
        <h2>RAKAN STUDIOS</h2>
        <div class="input-group"><label>اسم المستخدم</label><input type="text" id="username"></div>
        <div class="input-group"><label>كلمة المرور</label><input type="password" id="password"></div>
        <button class="btn-login" onclick="checkLogin()">دخول 🚀</button>
    </div>
</div>

<div id="appWrapper">
    <div class="sidebar">
        <h2>🌴 RAKAN STUDIOS</h2>
        <button class="nav-btn active" onclick="switchTab('games', event)">🎮 الألعاب</button>
        <button class="nav-btn" onclick="switchTab('employees', event)">👥 الموظفين</button>
        <button class="nav-btn" onclick="switchTab('customers', event)">🏢 العملاء</button>
        <button class="nav-btn" onclick="switchTab('orders', event)">📦 الطلبات</button>
        <button class="nav-btn" style="color:var(--danger)" onclick="logout()">خروج 🚪</button>
    </div>
    <div class="main-content" id="mainArea">
        <div id="games" class="tab-content active">
            <div class="card-panel">
                <input type="hidden" id="g_oldId">
                <div class="form-grid">
                    <input type="text" id="g_title" placeholder="اسم اللعبة">
                    <select id="g_platform"><option>PlayStation 5</option><option>PC Gaming</option><option>Xbox Series X</option><option>Multi-Platform</option></select>
                    <input type="number" id="g_price" placeholder="السعر ($)">
                </div>
                <button class="btn-action" onclick="saveData('games')">حفظ / تحديث 💾</button>
            </div>
            <table><thead><tr><th>الاسم</th><th>المنصة</th><th>السعر</th><th>التحكم</th></tr></thead><tbody id="games_table"></tbody></table>
        </div>
        <!-- (الأقسام الأخرى كما كانت) -->
        <div id="employees" class="tab-content">
             <div class="card-panel">
                <input type="hidden" id="e_oldId">
                <div class="form-grid">
                    <input type="text" id="e_name" placeholder="الاسم">
                    <select id="e_role"><option>Senior Developer</option><option>Junior Developer</option><option>Sales Manager</option></select>
                    <input type="number" id="e_salary" placeholder="الراتب">
                </div>
                <button class="btn-action" onclick="saveData('employees')">حفظ / تحديث 💾</button>
            </div>
            <table><thead><tr><th>الاسم</th><th>المنصب</th><th>الراتب</th><th>التحكم</th></tr></thead><tbody id="employees_table"></tbody></table>
        </div>
        <div id="customers" class="tab-content">
             <div class="card-panel">
                <input type="hidden" id="c_oldId">
                <div class="form-grid">
                    <input type="text" id="c_name" placeholder="اسم العميل"><input type="text" id="c_phone" placeholder="الهاتف">
                </div>
                <button class="btn-action" onclick="saveData('customers')">حفظ / تحديث 💾</button>
            </div>
            <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>التحكم</th></tr></thead><tbody id="customers_table"></tbody></table>
        </div>
        <div id="orders" class="tab-content">
             <div class="card-panel">
                <input type="hidden" id="o_oldId">
                <div class="form-grid">
                    <input type="text" id="o_customerId" placeholder="اسم العميل"><input type="text" id="o_item" placeholder="المنتج"><input type="number" id="o_total" placeholder="المبلغ">
                    <select id="o_status"><option>تم الدفع</option><option>لم يتم الدفع</option></select>
                </div>
                <button class="btn-action" onclick="saveData('orders')">حفظ / تحديث 💾</button>
            </div>
            <table><thead><tr><th>العميل</th><th>المنتج</th><th>المبلغ</th><th>الحالة</th><th>التحكم</th></tr></thead><tbody id="orders_table"></tbody></table>
        </div>
    </div>
</div>

<script>
    const API = "https://rakan-games-97-g6hxapcfg7h6fjfk.centralindia-01.azurewebsites.net/api/GameApi";
    let cache = {};

    window.onload = () => { if(localStorage.getItem('adminSession')) { document.getElementById('loginModal').style.display='none'; document.getElementById('appWrapper').style.display='flex'; switchTab(localStorage.getItem('activeTab')||'games'); } };

    function checkLogin() {
        if(document.getElementById('username').value=="Rakan" && document.getElementById('password').value=="Rakan12345") {
            localStorage.setItem('adminSession','true'); document.getElementById('loginModal').style.display='none'; document.getElementById('appWrapper').style.display='flex'; switchTab('games');
        } else alert("خطأ!");
    }
    function logout() { localStorage.clear(); location.reload(); }
    function switchTab(tab, e) { localStorage.setItem('activeTab', tab); document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); document.getElementById(tab).classList.add('active'); loadData(tab); }

    async function loadData(type) {
        const res = await fetch(`${API}?type=${type}&_t=${Date.now()}`);
        cache[type] = await res.json();
        const tbody = document.getElementById(`${type}_table`); tbody.innerHTML = '';
        cache[type].forEach((item, i) => {
            let row = document.createElement('tr');
            let id = item.id || item.title || item.name || item.customerId;
            let title = item.title || item.name || item.customerId;
            let cells = type=='games'?`<td>${item.title}</td><td>${item.platform}</td><td>$${item.price}</td>`:type=='employees'?`<td>${item.name}</td><td>${item.role}</td><td>$${item.salary}</td>`:type=='customers'?`<td>${item.name}</td><td>${item.phone}</td>`:`<td>${item.customerId}</td><td>${item.item}</td><td>$${item.total}</td><td>${item.status}</td>`;
            row.innerHTML = cells + `<td><button class="btn-edit" onclick="prepareEdit('${type}', ${i})">تعديل</button><button class="btn-del" onclick="del('${type}', '${id}', '${title}')">حذف</button></td>`;
            tbody.appendChild(row);
        });
    }

    function prepareEdit(type, i) {
        let item = cache[type][i];
        let id = item.id || item.title || item.name || item.customerId;
        if(type=='games') { document.getElementById('g_oldId').value=id; document.getElementById('g_title').value=item.title; document.getElementById('g_platform').value=item.platform; document.getElementById('g_price').value=item.price; }
        else if(type=='employees') { document.getElementById('e_oldId').value=id; document.getElementById('e_name').value=item.name; document.getElementById('e_role').value=item.role; document.getElementById('e_salary').value=item.salary; }
        // ... (تكملة باقي الحقول)
        document.getElementById('mainArea').scrollTo({top:0, behavior:'smooth'});
    }

    async function del(type, id, title) {
        if(!confirm("أكيد تبي تحذف؟")) return;
        // حذف مشفر لضمان مسح الأسماء اللي فيها مسافات
        await fetch(API, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({type:type, action:"delete", id:id, title:title}) });
        loadData(type);
    }

    async function saveData(type) {
        let body = {type: type};
        let oldId = "";
        if(type=='games') { body.title = document.getElementById('g_title').value; body.platform = document.getElementById('g_platform').value; body.price = document.getElementById('g_price').value; oldId = document.getElementById('g_oldId').value; }
        // ... (تكملة حفظ باقي الأقسام)
        if(oldId) await fetch(API, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({type:type, action:"delete", id:oldId, title:oldId}) });
        await fetch(API, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
        loadData(type);
    }
</script>
</body>
</html>
