<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🌴 RAKAN STUDIOS | لوحة التحكم والإدارة</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0d0a07; color: #ffffff; min-height: 100vh; padding: 20px; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #a67c52; padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .admin-header h1 { font-size: 26px; color: #10b981; font-weight: 900; }
        
        .header-btns { display: flex; gap: 10px; }
        .btn-view-store { background: linear-gradient(135deg, #006c35, #044b25); color: #fff; border: 1px solid #a67c52; padding: 10px 20px; border-radius: 12px; font-weight: bold; text-decoration: none; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-view-store:hover { background: #a67c52; color: #0d0a07; }

        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }

        .card-box { background: #1c140e; border: 1px solid #332216; border-radius: 18px; padding: 22px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-box h3 { color: #a67c52; font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #332216; padding-bottom: 8px; font-weight: 800; }

        input, select, button { width: 100%; padding: 12px 15px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #332216; background: #0d0a07; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #006c35; }

        .btn-submit { background: #006c35; border: 1px solid #a67c52; font-weight: bold; cursor: pointer; transition: 0.3s; color: #fff; margin-top: 5px; }
        .btn-submit:hover { background: #a67c52; color: #0d0a07; }

        .btn-cancel { background: #332216; color: #fff; border: none; font-weight: bold; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: right; padding: 12px; border-bottom: 1px solid #332216; font-size: 13px; }
        th { background: #0d0a07; color: #a67c52; font-weight: 800; }

        .action-btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; margin-left: 5px; }
        .btn-edit { background: #d97706; color: #fff; }
        .btn-del { background: #dc2626; color: #fff; }

        .status-badge { background: #006c35; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 11px; }
        #statusAlert { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; background: #006c35; color: #fff; font-weight: bold; display: none; z-index: 9999; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>⚙️ لوحة التحكم وإدارة متجر راكان ستوديوز</h1>
        <div class="header-btns">
            <!-- زر معاينة المتجر مع خيار الفتح في تبويب جديد لتسهيل العودة -->
            <a href="index.html" target="_blank" class="btn-view-store">👁️ معاينة المتجر (نافذة جديدة)</a>
            <a href="index.html" class="btn-view-store" style="background:#332216;">⬅ العودة للمتجر مباشرة</a>
        </div>
    </div>

    <div class="admin-grid">
        <!-- قسم إضافة / تعديل اللعبة -->
        <div>
            <div class="card-box">
                <h3 id="formTitle">🎮 إضافة لعبة جديدة</h3>
                <input type="hidden" id="editGameIndex">
                <input type="text" id="g_title" placeholder="اسم اللعبة (مثال: GTA V)">
                <input type="text" id="g_price" placeholder="السعر بالدولار ($)">
                <select id="g_platform">
                    <option value="PlayStation 5">🎮 PlayStation 5</option>
                    <option value="PC Gaming">💻 PC Gaming</option>
                    <option value="Xbox Series X">🕹️ Xbox Series X</option>
                    <option value="Multi-Platform">🌐 Multi-Platform</option>
                </select>
                <button class="btn-submit" onclick="saveGame()" id="saveBtn">حفظ اللعبة 💾</button>
                <button class="btn-cancel" onclick="resetForm()" id="cancelEditBtn" style="display:none;">إلغاء التعديل</button>
            </div>
        </div>

        <!-- قسم الألعاب والطلبات والموظفين -->
        <div>
            <!-- جدول الألعاب مع الحذف والتعديل -->
            <div class="card-box">
                <h3>🎮 قائمة الألعاب المتوفرة بالمتجر</h3>
                <table>
                    <thead>
                        <tr>
                            <th>اسم اللعبة</th>
                            <th>المنصة</th>
                            <th>السعر</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="gamesTableBody">
                        <tr><td colspan="4" style="text-align:center;">جاري تحميل الألعاب...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- جدول الطلبات والموظفين / العملاء -->
            <div class="card-box">
                <h3>👥 قائمة الموظفين والعملاء المسجلين</h3>
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>المنطقة</th>
                            <th>المدينة</th>
                            <th>رقم الهاتف</th>
                        </tr>
                    </thead>
                    <tbody id="customersTableBody">
                        <tr><td colspan="4" style="text-align:center;">جاري جلب القائمة...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="statusAlert"></div>

<script>
    const API_URL = "https://rakan-games-97-g6hxapcfg7h6fjfk.centralindia-01.azurewebsites.net/api/GameApi";
    let loadedGames = [];

    window.addEventListener('DOMContentLoaded', () => {
        fetchGames();
        fetchCustomers();
    });

    // جلب الألعاب
    async function fetchGames() {
        const tbody = document.getElementById('gamesTableBody');
        try {
            const res = await fetch(`${API_URL}?type=games&_t=${Date.now()}`, { cache: "no-store" });
            loadedGames = await res.json();
            renderGamesTable();
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="4" style="color:#ef4444; text-align:center;">خطأ في جلب البيانات</td></tr>';
        }
    }

    // عرض الجدول مع أزرار التعديل والحذف
    function renderGamesTable() {
        const tbody = document.getElementById('gamesTableBody');
        tbody.innerHTML = '';
        
        if (!loadedGames || loadedGames.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#d4c5b9;">لا توجد ألعاب مضافة حالياً.</td></tr>';
            return;
        }

        loadedGames.forEach((g, idx) => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${g.title || 'بدون عنوان'}</strong></td>
                    <td><span class="status-badge">${g.platform || 'General'}</span></td>
                    <td style="color:#10b981; font-weight:bold;">$${g.price || 0}</td>
                    <td>
                        <button class="action-btn btn-edit" onclick="editGame(${idx})">تعديل ✏️</button>
                        <button class="action-btn btn-del" onclick="deleteGame('${g.title}')">حذف 🗑️</button>
                    </td>
                </tr>
            `;
        });
    }

    // حفظ أو تعديل لعبة
    async function saveGame() {
        const title = document.getElementById('g_title').value.trim();
        const price = document.getElementById('g_price').value.trim();
        const platform = document.getElementById('g_platform').value;

        if (!title || !price) {
            return alert('يرجى ملء جميع الحقول المطلوبة');
        }

        showNotify("جاري حفظ البيانات...");
        const payload = { type: 'games', title: title, price: String(price), platform: platform };

        try {
            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            showNotify("تم حفظ اللعبة بنجاح! 🚀");
            resetForm();
            fetchGames();
        } catch (e) {
            alert('حدث خطأ أثناء الحفظ');
        }
    }

    // تجهيز حقول التعديل
    function editGame(index) {
        const g = loadedGames[index];
        if (!g) return;

        document.getElementById('editGameIndex').value = index;
        document.getElementById('g_title').value = g.title || '';
        document.getElementById('g_price').value = g.price || '';
        document.getElementById('g_platform').value = g.platform || 'PlayStation 5';

        document.getElementById('formTitle').innerText = '✏️ تعديل بيانات اللعبة';
        document.getElementById('saveBtn').innerText = 'تحديث اللعبة 🔄';
        document.getElementById('cancelEditBtn').style.display = 'block';
    }

    function resetForm() {
        document.getElementById('editGameIndex').value = '';
        document.getElementById('g_title').value = '';
        document.getElementById('g_price').value = '';
        document.getElementById('formTitle').innerText = '🎮 إضافة لعبة جديدة';
        document.getElementById('saveBtn').innerText = 'حفظ اللعبة 💾';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    // حذف لعبة
    async function deleteGame(title) {
        if (!confirm(`هل أنت تأكد من رغبتك في حذف اللعبة (${title})؟`)) return;

        showNotify("جاري حذف اللعبة...");
        try {
            await fetch(`${API_URL}?type=games&title=${encodeURIComponent(title)}`, {
                method: "DELETE"
            });
            showNotify("تم الحذف بنجاح 🗑️");
            fetchGames();
        } catch (e) {
            showNotify("تم تنفيذ أمر الحذف 🗑️");
            fetchGames();
        }
    }

    // جلب قائمة الموظفين والعملاء
    async function fetchCustomers() {
        const tbody = document.getElementById('customersTableBody');
        try {
            const res = await fetch(`${API_URL}?type=customers&_t=${Date.now()}`, { cache: "no-store" });
            const data = await res.json();
            
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#d4c5b9;">لا يوجد موظفين/عملاء مسجلين حالياً.</td></tr>';
                return;
            }

            data.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${c.name || 'غير معروف'}</strong></td>
                        <td>${c.region || '-'}</td>
                        <td>${c.city || '-'}</td>
                        <td>${c.phone || '-'}</td>
                    </tr>
                `;
            });
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="4" style="color:#ef4444; text-align:center;">خطأ في جلب البيانات</td></tr>';
        }
    }

    function showNotify(msg) {
        const el = document.getElementById('statusAlert');
        el.innerText = msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }
</script>
</body>
</html>
