<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --success: #22c55e;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* شاشة الـ PIN */
        .pin-screen {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
            border: 1px solid #334155;
        }

        .pin-screen input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* لوحة التحكم */
        .dashboard {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .stat-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--success);
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #334155;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة تسجيل الدخول بـ PIN -->
        <div class="pin-screen" id="pinScreen">
            <h2>🔒 لوحة إدارة المتجر</h2>
            <p style="color: #94a3b8; font-size: 0.9rem;">أدخل رمز PIN للدخول (الرمز: 1234)</p>
            <input type="password" id="pinInput" maxlength="4" placeholder="****">
            <button class="btn" onclick="checkPin()">دخول اللوحة</button>
        </div>

        <!-- لوحة التحكم الرئيسية -->
        <div class="dashboard" id="dashBoard">
            <h1>👑 مرحباً بك يا مدير المتجر</h1>
            <p style="color: #94a3b8; margin-bottom: 20px;">متابعة المبيعات والطلبات الحية عبر السحابة</p>

            <div class="stats-grid">
                <div class="stat-card">
                    <div>إجمالي الطلبات</div>
                    <div class="stat-val" id="totalOrders">0</div>
                </div>
                <div class="stat-card">
                    <div>إجمالي الأرباح</div>
                    <div class="stat-val" id="totalRevenue">0 ر.س</div>
                </div>
            </div>

            <h3>📦 قائمة الطلبات الأخيرة</h3>
            <table>
                <thead>
                    <tr>
                        <th>العميل</th>
                        <th>الإيميل</th>
                        <th>اللعبة</th>
                        <th>السعر</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <!-- الطلبات تظهر هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function checkPin() {
            const pin = document.getElementById('pinInput').value;
            if (pin === "1234") {
                document.getElementById('pinScreen').style.display = "none";
                document.getElementById('dashBoard').style.display = "block";
                loadDashboardData();
            } else {
                alert("رمز PIN غير صحيح!");
            }
        }

        function loadDashboardData() {
            const orders = JSON.parse(localStorage.getItem('my_orders_list')) || [];
            
            document.getElementById('totalOrders').innerText = orders.length;
            
            const revenue = orders.reduce((sum, order) => sum + order.price, 0);
            document.getElementById('totalRevenue').innerText = revenue + " ر.س";

            const table = document.getElementById('ordersTable');
            if(orders.length === 0) {
                table.innerHTML = `<tr><td colspan="5" style="text-align:center;">لا توجد طلبات بعد</td></tr>`;
            } else {
                table.innerHTML = orders.map(o => `
                    <tr>
                        <td>${o.customer}</td>
                        <td>${o.email}</td>
                        <td>${o.game}</td>
                        <td>${o.price} ر.س</td>
                        <td><span style="color: #22c55e;">${o.status}</span></td>
                    </tr>
                `).join('');
            }
        }
    </script>
</body>
</html>
