<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakan Gaming Studio | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --success: #22c55e;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .pin-screen {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
            border: 1px solid #334155;
        }

        .pin-screen input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .dashboard {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #334155;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- تسجيل الدخول بالرمز السرّي PIN -->
        <div class="pin-screen" id="pinScreen">
            <h2>👑 Rakan Gaming Studio - Admin</h2>
            <p style="color: #94a3b8; margin-top: 8px;">أدخل رمز PIN لوحة التحكم السحابية</p>
            <input type="password" id="pinInput" maxlength="4" placeholder="****">
            <button class="btn" onclick="checkPin()">دخول اللوحة السحابية</button>
        </div>

        <!-- لوحة التحكم الإدارية -->
        <div class="dashboard" id="dashBoard">
            <h1>إدارة متجر Rakan Gaming Studio</h1>
            <p style="color: #94a3b8; margin-bottom: 25px;">متابعة البيانات والطلبات المباشرة من السحابة (Azure APIs)</p>

            <h3>📦 الطلبات الحية من السحابة</h3>
            <table>
                <thead>
                    <tr>
                        <th>اسم العميل</th>
                        <th>البريد الإلكتروني</th>
                        <th>اللعبة</th>
                        <th>السعر</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <tr><td colspan="4" style="text-align:center;">جاري الاتصال بالسحابة لاستدعاء البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function checkPin() {
            const pin = document.getElementById('pinInput').value;
            if (pin === "1234") {
                document.getElementById('pinScreen').style.display = "none";
                document.getElementById('dashBoard').style.display = "block";
                loadCloudOrders();
            } else {
                alert("رمز PIN غير صحيح!");
            }
        }

        async function loadCloudOrders() {
            const table = document.getElementById('ordersTable');
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                
                if(!orders || orders.length === 0) {
                    table.innerHTML = `<tr><td colspan="4" style="text-align:center;">لا توجد طلبات سحابية مسجلة بعد</td></tr>`;
                    return;
                }

                table.innerHTML = orders.map(o => `
                    <tr>
                        <td>${o.customerName || 'عميل'}</td>
                        <td>${o.customerEmail || '-'}</td>
                        <td>${o.gameTitle || 'لعبة'}</td>
                        <td>${o.price} ر.س</td>
                    </tr>
                `).join('');
            } catch (err) {
                table.innerHTML = `<tr><td colspan="4" style="text-align:center; color: #ef4444;">تعذر استدعاء الطلبات من Azure Functions.</td></tr>`;
            }
        }
    </script>
</body>
</html>
