<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>⚡ Rakan Gaming Studios | الإدارة الاحترافية</title>
    <style>
        :root { --primary: #006c35; --danger: #dc2626; --bg-main: #0b0f19; --bg-card: #131b2e; --accent: #38bdf8; --text: #f1f5f9; }
        body { background: var(--bg-main); color: var(--text); padding: 25px; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #1f2937; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #1f2937; text-align: right; }
        button { padding: 8px 12px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; margin-left: 5px; }
        .btn-edit { background: #d97706; color: white; }
        .btn-del { background: var(--danger); color: white; }
        input, select { padding: 10px; margin: 5px; background: #000; color: white; border: 1px solid #334155; border-radius: 5px; }
    </style>
</head>
<body>

<div style="display:flex; gap:25px;">
    <!-- القائمة الجانبية -->
    <div style="width:250px;">
        <button onclick="showTab('games', this)" class="nav-btn active">🎮 قسم الألعاب</button>
        <button onclick="showTab('orders', this)" class="nav-btn">📊 قسم الطلبات</button>
        <button onclick="showTab('staff', this)" class="nav-btn">👥 قسم الموظفين</button>
        <button onclick="showTab('customers', this)" class="nav-btn">🧑‍🤝‍🧑 قسم العملاء</button>
        <a href="index.html" style="display:block; margin-top:30px; color:var(--accent); text-decoration:none;">👁️ معاينة المتجر</a>
    </div>

    <!-- المحتوى -->
    <div style="flex:1;">
        <!-- قسم الألعاب -->
        <div id="games" class="tab-content active">
            <div class="card">
                <h3>إدارة الألعاب (إضافة/تعديل)</h3>
                <input type="text" id="g_title" placeholder="اسم اللعبة">
                <input type="number" id="g_price" placeholder="السعر">
                <select id="g_platform"><option value="PS5">PS5</option><option value="PC">PC</option></select>
                <button onclick="saveItem('games')" class="btn-edit">حفظ</button>
            </div>
            <table><thead><tr><th>الاسم</th><th>المنصة</th><th>السعر</th><th>التحكم</th></tr></thead><tbody id="body_games"></tbody></table>
        </div>

        <!-- قسم الطلبات -->
        <div id="orders" class="tab-content">
            <h3>سجل الطلبات</h3>
            <table><thead><tr><th>العميل</th><th>المنتج</th><th>المبلغ</th><th>التحكم</th></tr></thead><tbody id="body_orders"></tbody></table>
        </div>

        <!-- قسم الموظفين -->
        <div id="staff" class="tab-content">
            <div class="card">
                <h3>إدارة الموظفين (رواتب ومناصب)</h3>
                <input type="text" id="s_name" placeholder="اسم الموظف">
                <input type="text" id="s_role" placeholder="المنصب">
                <input type="number" id="s_salary" placeholder="الراتب">
                <button onclick="saveItem('staff')" class="btn-edit">حفظ الموظف</button>
            </div>
            <table><thead><tr><th>الاسم</th><th>المنصب</th><th>الراتب</th><th>التحكم</th></tr></thead><tbody id="body_staff"></tbody></table>
        </div>

        <!-- قسم العملاء -->
        <div id="customers" class="tab-content">
            <h3>العملاء المسجلين</h3>
            <table><thead><tr><th>الاسم</th><th>المنطقة</th><th>المدينة</th><th>الهاتف</th><th>التحكم</th></tr></thead><tbody id="body_customers"></tbody></table>
        </div>
    </div>
</div>

<script>
    const API = "https://rakan-games-97-g6hxapcfg7h6fjfk.centralindia-01.azurewebsites.net/api/GameApi";
    
    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(btn) btn.classList.add('active');
        fetchData(id);
    }

    async function fetchData(type) {
        const res = await fetch(`${API}?type=${type}`);
        const data = await res.json();
        const tbody = document.querySelector(`#body_${type}`);
        tbody.innerHTML = '';
        
        data.forEach(item => {
            const row = document.createElement('tr');
            if(type === 'games') {
                row.innerHTML = `<td>${item.title}</td><td>${item.platform}</td><td>$${item.price}</td><td><button onclick="del('games','${item.title}')" class="btn-del">حذف</button></td>`;
            } else if(type === 'staff') {
                row.innerHTML = `<td>${item.name}</td><td>${item.role}</td><td>$${item.salary}</td><td><button onclick="del('staff','${item.name}')" class="btn-del">حذف</button></td>`;
            } else if(type === 'orders') {
                row.innerHTML = `<td>${item.customerId}</td><td>${item.item}</td><td>$${item.total}</td><td><button onclick="del('orders','${item.customerId}')" class="btn-del">حذف</button></td>`;
            } else {
                row.innerHTML = `<td>${item.name}</td><td>${item.region}</td><td>${item.city}</td><td>${item.phone}</td><td><button onclick="del('customers','${item.name}')" class="btn-del">حذف</button></td>`;
            }
            tbody.appendChild(row);
        });
    }

    async function saveItem(type) {
        let payload = { type: type };
        if(type === 'games') {
            payload.title = document.getElementById('g_title').value;
            payload.price = document.getElementById('g_price').value;
            payload.platform = document.getElementById('g_platform').value;
        } else {
            payload.name = document.getElementById('s_name').value;
            payload.role = document.getElementById('s_role').value;
            payload.salary = document.getElementById('s_salary').value;
            payload.title = payload.name;
        }
        await fetch(API, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload)});
        fetchData(type);
    }

    async function del(type, title) {
        if(!confirm("أكيد تبي تحذف؟")) return;
        await fetch(`${API}?type=${type}&title=${encodeURIComponent(title)}`, { method: "DELETE" });
        fetchData(type);
    }

    showTab('games');
</script>
</body>
</html>
