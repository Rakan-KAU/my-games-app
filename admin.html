<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ لوحة تحكم الإدارة | RAKAN STUDIOS</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0d0a07; color: #ffffff; padding: 40px 20px; display: flex; justify-content: center; }
        .admin-card { background: #1c140e; border: 1px solid #a67c52; padding: 35px; border-radius: 20px; width: 100%; max-width: 650px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        h1 { color: #ffffff; font-size: 26px; margin-bottom: 20px; border-bottom: 1px solid #332216; padding-bottom: 10px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #a67c52; margin-bottom: 8px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #332216; background: #0d0a07; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #006c35; }
        .btn-save { width: 100%; padding: 14px; background: linear-gradient(135deg, #006c35, #044b25); color: #fff; border: 1px solid #a67c52; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-save:hover { background: #a67c52; color: #0d0a07; }
        .btn-preview { width: 100%; padding: 12px; background: #332216; color: #d4c5b9; border: none; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; text-decoration: none; display: inline-block; text-align: center; }
        .alert-success { background: rgba(0,108,53,0.3); border: 1px solid #006c35; color: #10b981; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>⚙️ لوحة التحكم بالمحتوى والعروض</h1>
        
        <div id="alertMsg" class="alert-success">✨ تم حفظ جميع التعديلات ونشرها للمتجر بنجاح!</div>

        <div class="form-group">
            <label>عنوان بنر العروض (العرض الرئيسي):</label>
            <input type="text" id="adm_promoTitle" placeholder="مثال: 🔥 عروض الشهر المباشرة">
        </div>

        <div class="form-group">
            <label>وصف العرض:</label>
            <input type="text" id="adm_promoSub" placeholder="مثال: خصم خاص وتسليم فورّي عند الشراء">
        </div>

        <div class="form-group">
            <label>وقت العداد التنازلي (بالساعات):</label>
            <input type="number" id="adm_timerHours" placeholder="مثال: 6">
        </div>

        <div class="form-group">
            <label>نص تقييم الألعاب المفضلة:</label>
            <input type="text" id="adm_ratingText" placeholder="مثال: ⭐ 4.9/5 (150 تقييم)">
        </div>

        <div class="form-group">
            <label>وسام الكارت العلوي:</label>
            <input type="text" id="adm_bestSellerTag" placeholder="مثال: 🔥 الأكثر مبيعاً">
        </div>

        <button class="btn-save" onclick="saveAdminSettings()">تطبيق وتحديث المتجر فوراً 🚀</button>
        <a href="index.html" class="btn-preview">معاينة المتجر 👁️</a>
    </div>

    <script>
        // تحميل البيانات الحالية عند فتح الإدارة
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = JSON.parse(localStorage.getItem('customStoreConfig')) || {};
            document.getElementById('adm_promoTitle').value = savedData.promoTitle || "🔥 عروض نهاية الأسبوع المباشرة";
            document.getElementById('adm_promoSub').value = savedData.promoSub || "احصل على تسليم فوري وتخفيض تلقائي عند الشراء عبر المتجر الرقمي";
            document.getElementById('adm_timerHours').value = savedData.timerHours || 5;
            document.getElementById('adm_ratingText').value = savedData.ratingText || "⭐ 4.9/5 (128 تقييم)";
            document.getElementById('adm_bestSellerTag').value = savedData.bestSellerTag || "🔥 الأكثر مبيعاً";
        });

        function saveAdminSettings() {
            const config = {
                promoTitle: document.getElementById('adm_promoTitle').value.trim(),
                promoSub: document.getElementById('adm_promoSub').value.trim(),
                timerHours: parseInt(document.getElementById('adm_timerHours').value) || 5,
                ratingText: document.getElementById('adm_ratingText').value.trim(),
                bestSellerTag: document.getElementById('adm_bestSellerTag').value.trim()
            };

            localStorage.setItem('customStoreConfig', JSON.stringify(config));
            
            const alert = document.getElementById('alertMsg');
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
